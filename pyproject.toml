[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-perceive"
version = "0.2.0"
description = "Dual-channel agent sight for short video: WORDS | MOTION | SEEN"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Grok" },
]
maintainers = [
  { name = "Isaac" },
]
keywords = [
  "video",
  "agents",
  "perception",
  "motion",
  "multimodal",
  "ffmpeg",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "Pillow>=10.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
video-perceive = "video_perceive.perceive:main"
vp = "video_perceive.perceive:main"

[project.urls]
Homepage = "https://github.com/isaac-ranger/video-perceive"
Issues = "https://github.com/isaac-ranger/video-perceive/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_perceive = ["py.typed"]
